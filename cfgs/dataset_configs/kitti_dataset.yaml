DATASET: 'KittiDataset'
DATA_PATH: '../data/kitti'

POINT_CLOUD_RANGE: [0, -39.68, -3, 69.12, 39.68, 1]

DATA_SPLIT: {
    'train': train,
    'test': val
}

INFO_PATH: {
    'train': [kitti_infos_train.pkl],
    'test': [kitti_infos_val.pkl],
}

GET_ITEM_LIST: ["points"]
FOV_POINTS_ONLY: True

DATA_AUGMENTOR:
    DISABLE_AUG_LIST: ['random_world_frustum_dropout', 'random_local_frustum_dropout', 'random_local_translation']
    AUG_CONFIG_LIST:
        - NAME: gt_sampling
          USE_ROAD_PLANE: False
          DB_INFO_PATH:
              - kitti_dbinfos_train.pkl
          PREPARE: {
             filter_by_min_points: ['Mini_bus:5', 'Large_bus:5', 'Mini_truck:5', 'Medium_truck:5', 'Heavy_truck:5', 'Extra_large_truck:5', 'Container_truck:5', 'Motorcycle:5', 'Tractor:5'],
             filter_by_difficulty: [-1, 2],
          }

          SAMPLE_GROUPS: ['Mini_bus:15','Large_bus:15','Mini_truck:15','Medium_truck:15','Heavy_truck:15','Extra_large_truck:15','Container_truck:15','Motorcycle:15','Tractor:15']
          NUM_POINT_FEATURES: 4
          DATABASE_WITH_FAKELIDAR: False
          REMOVE_EXTRA_WIDTH: [0.0, 0.0, 0.0]
          LIMIT_WHOLE_SCENE: False

        - NAME: random_local_rotation
          LOCAL_ROT_ANGLE: [-0.15707963267, 0.15707963267]

        - NAME: random_local_scaling
          LOCAL_SCALE_RANGE: [0.95, 1.05]

        - NAME: random_world_flip
          ALONG_AXIS_LIST: ['x']

        - NAME: random_world_rotation
          WORLD_ROT_ANGLE: [-0.78539816, 0.78539816]

        - NAME: random_world_scaling
          WORLD_SCALE_RANGE: [0.95, 1.05]

        - NAME: random_world_translation
          WORLD_TRANSLATION_RANGE: [ -0.2, 0.2 ]
          ALONG_AXIS_LIST: ['x', 'y', 'z']

        - NAME: random_local_translation
          LOCAL_TRANSLATION_RANGE: [0.95, 1.05]
          ALONG_AXIS_LIST: ['x', 'y', 'z']

        - NAME: random_world_frustum_dropout
          INTENSITY_RANGE: [ 0, 0.2 ]
          DIRECTION: ['top']

        - NAME: random_local_frustum_dropout
          INTENSITY_RANGE: [ 0, 0.2 ]
          DIRECTION: ['top']


POINT_FEATURE_ENCODING: {
    encoding_type: absolute_coordinates_encoding,
    used_feature_list: ['x', 'y', 'z', 'intensity'],
    src_feature_list: ['x', 'y', 'z', 'intensity'],
}


DATA_PROCESSOR:
    - NAME: mask_points_and_boxes_outside_range
      REMOVE_OUTSIDE_BOXES: True

    - NAME: shuffle_points
      SHUFFLE_ENABLED: {
        'train': True,
        'test': False
      }

    - NAME: transform_points_to_voxels
      VOXEL_SIZE: [0.16, 0.16, 4]
      MAX_POINTS_PER_VOXEL: 32
      MAX_NUMBER_OF_VOXELS: {
        'train': 16000,
        'test': 40000
      }
